<!doctype html><html><head><meta charset="utf-8">
<style>:root{--w:1080px;--h:1080px}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; color: #071828; position: relative; }
  .ur { font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; line-height: 2; }
  .green { color: #03822f; }
  .card { background: #fff; border-radius: 28px; box-shadow: 0 18px 50px rgba(7,24,40,.16); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #071828; color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
  .foot img { height: 62px; filter: brightness(0) invert(1); }
  .foot .cta { font-weight: 700; font-size: 30px; background: #03822f; padding: 14px 30px; border-radius: 60px; }
  .bg-dots { background-color: #f3faf5; background-image: radial-gradient(#d3ecda 2.5px, transparent 2.5px); background-size: 34px 34px; }
</style></head><body>
  <div class="bg-dots" style="position:absolute;inset:0"></div>
  <div style="position:absolute;top:50px;left:60px;right:60px;text-align:center">
    <div class="ur" style="font-size:70px;font-weight:700">دودھ والوں کی اپنی ایپ</div>
    <div style="font-size:36px;font-weight:600;margin-top:4px;color:#3a4a5c">The app made for milk sellers</div>
  </div>
  <div style="position:absolute;top:290px;left:0;right:0;bottom:140px;display:flex;align-items:center;justify-content:center"><img src="moopartner-bike.png" style="height:560px"></div>
  <div class="foot"><img src="moopartner-wordmark.png"><div class="cta">Download Moo Partner</div></div></body></html>
