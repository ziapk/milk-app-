<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86ef"/>
      <stop offset="1" stop-color="#0f4fa8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8e3"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aebccd"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- morning sun -->
    <circle cx="390" cy="128" r="54" fill="#ffd166"/>
    <!-- milk wave -->
    <path d="M0 418 C70 392 130 440 200 420 S330 386 400 414 S480 430 512 410 V512 H0 Z" fill="#ffffff"/>
    <path d="M0 446 C90 426 150 462 236 446 S392 424 512 444 V512 H0 Z" fill="#e6f0fb"/>
  </g>

  <!-- bicycle -->
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="146" cy="346" r="60"/>
    <circle cx="370" cy="346" r="60"/>
    <path d="M146 346 L214 262 L254 346 Z"/>
    <path d="M254 346 L336 262 L214 262"/>
    <path d="M336 262 L370 346"/>
    <path d="M336 262 L326 222 M306 222 H346"/>
    <path d="M196 252 H236"/>
  </g>
  <circle cx="146" cy="346" r="9" fill="#ffffff"/>
  <circle cx="370" cy="346" r="9" fill="#ffffff"/>
  <circle cx="254" cy="346" r="12" fill="#ffffff"/>

  <!-- rear carrier -->
  <path d="M86 262 H200 M100 262 L146 346" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- two milk cans on the carrier -->
  <g stroke="#0f4fa8" stroke-width="6" stroke-linejoin="round">
    <path d="M84 256 V196 Q84 180 98 174 L104 160 H128 L134 174 Q148 180 148 196 V256 Z" fill="url(#steel)"/>
    <rect x="98" y="146" width="36" height="16" rx="5" fill="#ffffff"/>
    <path d="M140 256 V196 Q140 180 154 174 L160 160 H184 L190 174 Q204 180 204 196 V256 Z" fill="url(#steel)"/>
    <rect x="154" y="146" width="36" height="16" rx="5" fill="#ffffff"/>
  </g>
  <path d="M86 222 H146 M142 222 H202" stroke="#2f86ef" stroke-width="10"/>

  <!-- milk drop -->
  <path d="M270 120 C270 120 236 162 236 186 A34 34 0 0 0 304 186 C304 162 270 120 270 120 Z" fill="#ffffff"/>
  <path d="M256 186 A14 14 0 0 0 270 200" fill="none" stroke="#2f86ef" stroke-width="6" stroke-linecap="round"/>
</svg>
