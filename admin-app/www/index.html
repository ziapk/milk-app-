<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MooPartner Admin</title>
<!-- The dashboard address the app opens. capacitor.config.ts reads it from here. -->
<meta name="admin-url" content="http://77.93.154.251:8010/admin/" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f5; color: #021627;
    font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #687581; margin: 0 0 20px; }
  button { background: #01822f; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <h1>Can't reach the server</h1>
    <p>Check your internet connection and try again.</p>
    <button id="retry">Try again</button>
  </div>
<script>
  document.getElementById('retry').onclick = () =>
    location.replace(document.querySelector('meta[name="admin-url"]').content);
</script>
</body>
</html>
